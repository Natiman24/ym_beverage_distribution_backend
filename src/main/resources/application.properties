spring.application.name=Beverage-Distribution-Backend
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway
spring.flyway.locations=classpath:db/migration/public

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP - connection pool with retry on startup
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000

# SSL Configuration
#spring.datasource.hikari.data-source-properties.ssl=true
#spring.datasource.hikari.data-source-properties.sslmode=require

# email properties
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=lematsystems@gmail.com
spring.mail.password=ywlauvylvczvqxgw

secret_key=${JWT_SECRET}
access_token_validity=60
refresh_token_validity=10080

spring.jackson.serialization.fail-on-empty-beans=false

# Timezone Configuration
spring.jackson.time-zone=Africa/Addis_Ababa
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Addis_Ababa