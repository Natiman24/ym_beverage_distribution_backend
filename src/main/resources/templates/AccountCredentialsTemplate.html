<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<body style="font-family: Arial, Helvetica, sans-serif; color: #222; font-size: 14px; line-height: 1.5;">
  <h2 style="color: #0f3e6f;">Your account is ready</h2>
  <p>A user account has been created for you. You can sign in immediately with these temporary credentials:</p>
  <p><strong>Email:</strong> <span th:text="${email}"></span><br/>
     <strong>Temporary password:</strong> <span th:text="${password}"></span></p>
  <p>Please change your password after signing in and do not share these credentials.</p>
</body>
</html>
